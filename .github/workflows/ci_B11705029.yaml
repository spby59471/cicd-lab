name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ] # 確保推送到主分支時觸發

jobs:
  ci-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript typecheck
      run: npm run typecheck

    - name: Prettier check
      run: npm run format:check

    - name: Run Tests
      run: npm run test

    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Vitest Tests
        path: 'test-results.json'
        reporter: jest-json

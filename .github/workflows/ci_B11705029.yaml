name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  ci-check:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: true

    steps:
    # 1. 檢出程式碼
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 設定 Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 3. 安裝套件
    - name: Install dependencies
      run: npm ci

    # 4. TypeScript 檢查
    - name: TypeScript typecheck
      run: npm run typecheck

    # 5. Prettier 檢查
    - name: Prettier check
      run: |
        npx prettier --write .
        npx prettier --check .

    # 6. 執行測試並直接整合到 GitHub Actions 頁面
    - name: Run Tests
      run: npx vitest run --reporter=default --reporter=github-actions